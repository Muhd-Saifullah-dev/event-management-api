name: CI


on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependency
        run:  npm ci

      - name: Format Check
        run:  npm run format:check
        
      - name: Build
        run: npm run build

      - name: CI Passed
        run: echo "CI Passed successfully! 🎉"
          
    
